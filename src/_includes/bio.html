<p>
  <img
    src="{{ include.bio.image | relative_url }}"
    alt="{{ include.bio.image_alt | escape }}"
    title="{{ include.bio.image_alt | escape }}"
  />
</p>

{{ include.body | markdownify }}

<a
  class="bio-home"
  href="{{ '/' | relative_url }}"

    viewBox="0 0 24 24"

    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"

    focusable="false"

  </svg>
  <span>all postz</span>
