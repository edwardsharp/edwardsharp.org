<header class="site-header">
  <a
    class="wordmark"
    href="{{ '/' | relative_url }}"
    {% if page.url == '/' %}
      aria-current="page"
    {% endif %}
    >edwardsharp<span>.org</span></a
  >
  <nav aria-label="main navigation">
    <a
      href="{{ '/' | relative_url }}"
      {% if page.url == '/' %}
        aria-current="page"
      {% endif %}
      >home</a
    >
    <a
      href="{{ '/archive/' | relative_url }}"
      {% if page.url == '/archive/' %}
        aria-current="page"
      {% endif %}
      >archive</a
    >
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </nav>
</header>
