<header class="site-header">
  <a
    class="wordmark"
    href="{{ '/' | relative_url }}"
    {% if page.url == '/' %}
      aria-current="page"
    {% endif %}
    >edwardsharp<span>.org</span></a
  >
  {% if page.feed and site.posts.size > 0 %}
    <form class="feed-filter" hidden>
      <label for="feed-filter" class="visually-hidden">filter journal</label>
      <select id="feed-filter" name="filter" disabled>
        <option value="">all postz</option>
      </select>
    </form>
  {% endif %}
  <button
    class="header-toggle"
    type="button"
    aria-controls="site-navigation"
    aria-expanded="false"
    aria-label="open navigation"
    hidden
  >
    <span class="menu-icon" aria-hidden="true"></span>
  </button>
  <nav id="site-navigation" aria-label="main navigation">
    <a
      href="{{ '/archive/' | relative_url }}"
      {% if page.url == '/archive/' %}
        aria-current="page"
      {% endif %}
      >search</a
    >
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </nav>
</header>
