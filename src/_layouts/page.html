---
layout: default
---
<article class="page">
  <header class="page-heading">
    {% unless page.archive %}
      <p class="eyebrow"></p>
    {% endunless %}
    <h1>{{ page.title | escape }}</h1>
  </header>
  <div class="prose">
    {% if page.bio %}
      {% include bio.html bio=page body=content %}
    {% else %}
      {{ content }}
    {% endif %}
  </div>
</article>
