<!doctype html>
<html lang="{{ site.lang | default: 'en' | escape }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>
      {% if page.url != '/' %}{{ page.title | escape }} / {% endif %}
      {{ site.title | escape }}
    </title>
    <meta
      name="description"
      content="{{ page.description | default: site.description | escape }}"
    />
    {% if site.url != '' %}
      <link rel="canonical" href="{{ page.url | absolute_url }}" />
    {% endif %}
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}" />
  </head>
  <body
    {% if page.feed %}
      class="home-page"
    {% endif %}
  >
    <a class="skip-link" href="#main">skip to content</a>
    <div class="site-shell">
      {% include header.html %}
      <main id="main" tabindex="-1">{{ content }}</main>
      <footer class="site-footer">
        <span>{{ site.time | date: '%Y' }}</span>
        <span>made with 💖 in NYC</span>
      </footer>
    </div>
    {% if page.feed %}
      <script type="module" src="{{ '/src/assets/feed.bundle.js' | relative_url }}"></script>
    {% endif %}
    {% if page.archive %}
      <script type="module" src="{{ '/src/assets/archive.bundle.js' | relative_url }}"></script>
    {% endif %}
  </body>
</html>
