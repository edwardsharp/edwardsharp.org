---
title: home
layout: default
permalink: /
feed: true
searchable: false
---
<section class="journal" aria-labelledby="journal-title">
  <h1 id="journal-title" class="visually-hidden">journal</h1>
  {% if site.posts.size > 0 %}
    <div class="honeycomb-shell" data-honeycomb data-feed-url="{{ '/feed.json' | relative_url }}">
      <div class="honeycomb" role="list" aria-label="post previews">
        {% for post in site.posts limit: 24 %}
          {% include feed-card.html post=post %}
        {% endfor %}
      </div>
      <div class="feed-controls">
        <p class="feed-status visually-hidden" role="status" aria-live="polite"></p>
        <button class="feed-more" type="button" hidden>load more posts</button>
      </div>
      <dialog class="media-dialog" aria-labelledby="media-title">
        <header class="media-dialog__toolbar">
          <h2><a id="media-title" class="media-dialog__permalink"></a></h2>
          <button class="media-dialog__close" type="button" aria-label="close media" autofocus>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M6 6 18 18M6 18 18 6" />
            </svg>
          </button>
        </header>
        <p class="media-dialog__status" role="status"></p>
        <button class="media-dialog__retry" type="button" hidden>retry media</button>
        <div class="media-dialog__content prose"></div>
      </dialog>
    </div>
  {% else %}
    {% include post-list.html %}
  {% endif %}
</section>
