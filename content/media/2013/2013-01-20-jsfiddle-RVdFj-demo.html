<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="//fiddle.jshell.net/edwardsharp/RVdFj/listing_embed/?disableModals=true&amp;version=0"><title>jQuery UI slider theming customization</title>
<script type="text/javascript" src="//code.jquery.com/jquery-1.5.2.js"></script>
<link rel="stylesheet" type="text/css" href="/css/normalize.css">
<script type="text/javascript" src="//ajax.googleapis.com/ajax/libs/jqueryui/1.8.9/jquery-ui.js"></script>
<link rel="stylesheet" type="text/css" href="//ajax.googleapis.com/ajax/libs/jqueryui/1.8.11/themes/base/jquery-ui.css">
<style id="compiled-css" type="text/css">
      body{font:62.5% Verdana,Arial,sans-serif}
.default, .alt {
    margin: 1em;
    padding: 1em;
}
.a .ui-slider {
    border-radius: 0;
}
.a .ui-slider-handle {
    border-radius: 0;
}
.b .ui-slider {
    border-radius: 0;
    height: 1.1em;
}
.b .ui-slider-handle {
    border-radius: 0;
    top: .1em;
    height: 0.75em;
}
.c .ui-slider {
    border-radius: 2px;
}
.c .ui-slider-handle {
    border-radius: 4px;
    width: 0.4em;
    margin-left: -0.2em;
}
.d .ui-slider {
    height: 0.3em;
    border-radius: 10px;
}
.d .ui-slider-handle {
    height: 1em;
    top: -0.45em;
    border-radius: 0.5em;
    width: 1em;
    margin-left: -0.5em;
}
.e .ui-slider {
    border-radius: 2px;
    height: 0.3em;
}
.e .ui-slider-handle {
    height: 1.4em;
    top: -0.55em;
    border-radius: 0 0 16px 16px;
    width: 0.7em;
    margin-left: -0.35em;
}

.dafuq{
    top:-15px;  
    position:absolute;    
}

      /* EOS */
    </style></head><body><link rel="stylesheet" href="//ajax.googleapis.com/ajax/libs/jqueryui/1.8.11/themes/base/jquery-ui.css">
<br/>

<div class="default">
    <div class="slider"></div>
</div>

<script type="text/javascript">

$(".slider").slider({
    min: -40,
    max: 100,
    values: [-40, 15, 35, 55, 75, 100],
    step: 5,
    slide: function(event, ui) {
        if (ui.handle.children[0].id == 'sliderLabel0' || ui.handle.children[0].id == 'sliderLabel5'){
            return false;
        }
        updateSliderLabels(ui.values);
    }
});

function createSliderLabels() {
    var sliders = $(".ui-slider-handle");
    for (i = 0; i < sliders.length; i++) {
        $(".ui-slider-handle").eq(i).html("<div class='dafuq' id='sliderLabel" + i + "' ><div>");
    }
}

function updateSliderLabels(values){
    var sliders = $(".ui-slider-handle");
    for (i = 0; i < sliders.length; i++) {    
        $("#sliderLabel"+i).html(values[i]);
        //$("#sliderLabel"+i).html($(".slider").slider("values")[i]);
    }
}

createSliderLabels();
updateSliderLabels($(".slider").slider("values"));


  </script></body></html>
