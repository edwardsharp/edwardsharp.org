<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="//fiddle.jshell.net/edwardsharp/eZx8q/listing_embed/?disableModals=true&amp;version=2"><title>schleifer (Google Spreadsheets backend)</title>
<script type="text/javascript" src="//code.jquery.com/jquery-compat-git.js"></script>
<link rel="stylesheet" type="text/css" href="/css/normalize.css">
<style id="compiled-css" type="text/css">
      

      /* EOS */
    </style></head><body><div id="results"></div>
<script type="text/javascript">

var spreadsheet_id = '1NMXiuYIwO8oIGFV1bneO4bIQA-VqvZz8h1CEyk5YL0s';
var url = '//spreadsheets.google.com/feeds/cells/'+spreadsheet_id+'/od6/public/values?alt=json-in-script&callback=?';

var onSuccess = function(data) {
    var html = "";
    var entries = data.feed.entry;
    
    for (var i=0, len = entries.length; i<len; ++i) {
        html += entries[i].content.$t + ' ';
        if ((i + 1) % 3 == 0) {
            html += '<br/>';
        }
    }
    
    $('#results').html(html);
}

$.getJSON(url, cellEntries);

function cellEntries(json) {
  var table = document.createElement('table');
  table.setAttribute('id', 'output');
  var tbody = document.createElement('tbody');
  
  var tr;
  var thead;
  
  for (var i=0; i < json.feed.entry.length; i++) { 
    var entry = json.feed.entry[i];
    
    if (entry.gs$cell.col == '1') {
      if (tr != null) {
        tbody.appendChild(tr);
      }
      tr = document.createElement('tr');
    }
    
    var td = document.createElement('td');
    td.appendChild(document.createTextNode(entry.content.$t));
    tr.appendChild(td);
  } 
 
  tbody.appendChild(tr);
  table.appendChild(tbody);
  document.getElementById('results').appendChild(table);
}

  </script></body></html>
