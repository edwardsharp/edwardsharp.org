<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="https://fiddle.jshell.net/edwardsharp/mx8td67n/listing_embed/?disableModals=true&amp;version=6"><title>Material Floating Labels</title>
<script type="text/javascript" src="//code.jquery.com/jquery-2.1.0.js"></script>
<link rel="stylesheet" type="text/css" href="https://bootswatch.com/paper/bootstrap.css">
<style id="compiled-css" type="text/css">
      body {
    padding: 20px;
}

/* --- material floating label --- */

.form-group {
    display: flex;
    min-height: 55px;
}
.form-group textarea {
  margin-top: 15px;
}

.control-label {
    font-size: 16px;
    font-weight: 400;
    opacity: 0.4;
    pointer-events: none;
    position: absolute;
    transform: translate3d(0, 22px, 0) scale(1);
    transform-origin: left top;
    transition: 240ms;
}

.form-group.focused .control-label {
    opacity: 1;
    transform: scale(0.75);
}

.form-control {
    align-self: flex-end;
}

.form-control::-webkit-input-placeholder {
    color: transparent;
    transition: 240ms;
}
.form-control::-mox-placeholder {
    color: transparent;
}

.form-control:focus::-webkit-input-placeholder {
    transition: none;
}

      /* EOS */
    </style></head><body><link rel="stylesheet" href="http://bootswatch.com/paper/bootstrap.css">
<div class="form-group">
    <label class="control-label" for="inputNormal">Normal input</label>
    <input type="text" class="form-control" id="inputNormal" placeholder="Placeholder text" />
</div>

<div class="form-group">
    <label class="control-label" for="textArea">Text area</label>
    <textarea class="form-control" id="textArea"  ></textarea>
</div>
<script type="text/javascript">

$('.form-control').on('focus blur', function (e) {
    $(this).parents('.form-group').toggleClass('focused', (e.type === 'focus' || this.value.length > 0));
}).trigger('blur');

  </script></body></html>
