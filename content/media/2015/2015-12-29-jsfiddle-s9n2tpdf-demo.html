<div id="player"></div>


<script type="text/javascript">

// 2. This code loads the IFrame Player API code asynchronously.
var tag = document.createElement('script');
tag.src = "//www.youtube.com/iframe_api";
var firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

// 3. This function creates an <iframe> (and YouTube player)
//    after the API code downloads.
var player;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    height: '390',
    width: '640',
    events: {
      'onReady': onPlayerReady,
      'onStateChange': onPlayerStateChange
    }
  });
}

var videos = [{
  vid: '0Lu_WHn2tks',
  startSeconds: 10,
  endSeconds: 10.9
}, {
  vid: '0Lu_WHn2tks',
  startSeconds: 150,
  endSeconds: 151
}, {
  vid: '0Lu_WHn2tks',
  startSeconds: 666,
  endSeconds: 666.6
}, {
  vid: '0Lu_WHn2tks',
  startSeconds: 671,
  endSeconds: 672
}];
var index = 0;
// 4. The API will call this function when the video player is ready.
function onPlayerReady(event) {
  event.target.cueVideoById({
    videoId: videos[index].vid,
    startSeconds: videos[index].startSeconds,
    endSeconds: videos[index].endSeconds
  });
  event.target.playVideo();
}

function onPlayerStateChange(event) {
  console.log("State change: " + event.data + " for index: " + index);

  if (event.data === YT.PlayerState.ENDED && player.getVideoLoadedFraction() > 0) {
    console.log(index);
    if (index < videos.length - 1) {
      index++;
      event.target.loadVideoById({
        videoId: videos[index].vid,
        startSeconds: videos[index].startSeconds,
        endSeconds: videos[index].endSeconds
      });
    }
  }
}

var clicker = document.getElementById("clicker");
clicker.onclick = function () {
  console.log("hey hey");
}


  </script></body></html>
