<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="//fiddle.jshell.net/edwardsharp/ao5tfes2/listing_embed/?disableModals=true&amp;version=6"><title>pushboard template (Google Spreadsheets backend)</title>
<script type="text/javascript" src="//code.jquery.com/jquery-compat-git.js"></script>
<link rel="stylesheet" type="text/css" href="/css/normalize.css">
<style id="compiled-css" type="text/css">
      td {
    padding-right: 1em;
}
.name{
    font-weight: 900;
}
.date{
    background-color: #666;
    border: #fff 0.75em solid;
    color: #ccc;
}

      /* EOS */
    </style></head><body><div id="results"></div>
<script type="text/javascript">

var spreadsheet_id = '1PugfDgRTtRQosAqCb-C9OaRr0rvpFdpcQrP5tZA5oLE';
var url = '//spreadsheets.google.com/feeds/cells/'+spreadsheet_id+'/od6/public/values?alt=json-in-script&callback=?';


$.getJSON(url, cellEntries);

function cellEntries(json) {
  var table = document.createElement('table');
  table.setAttribute('id', 'output');
  var tbody = document.createElement('tbody');
  
  var tr;
  var thead;
  var header_col = [];
  var number_of_header_cellz = 8;
    
  for (var i=0; i < json.feed.entry.length; i++) { 

    if(i < number_of_header_cellz){
      header_col[(i)] = json.feed.entry[i].content.$t;
      continue;
    }
      
    var entry = json.feed.entry[i];
    
      
    if (entry.gs$cell.col == '1') {
      if (tr != null) {
        tbody.appendChild(tr);   
      }
      tr = document.createElement('tr');
    }
    
    
    var td = document.createElement('td');
    td.setAttribute('class', header_col[(i%number_of_header_cellz)]);
    td.appendChild(document.createTextNode(entry.content.$t));
    tr.appendChild(td);
  } 

  tbody.appendChild(tr);
  table.appendChild(tbody);
  document.getElementById('results').appendChild(table);
}

  </script></body></html>
