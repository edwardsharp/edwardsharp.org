<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="https://fiddle.jshell.net/edwardsharp/Atz5v/listing_embed/?disableModals=true&amp;version=0"><title>jsfiddle / Atz5v</title>
<script type="text/javascript" src="//cdnjs.cloudflare.com/ajax/libs/mootools/1.4.5/mootools-core-full-nocompat.js"></script>
<link rel="stylesheet" type="text/css" href="/css/normalize.css">
<style id="compiled-css" type="text/css">
      
.mesh {
  fill: none;
  stroke: #000;
  stroke-width: .25px;
}

.start {
  fill: none;
  stroke: brown;
}

.end {
  fill: none;
  stroke: steelblue;
}


      /* EOS */
    </style></head><body><!DOCTYPE html>
<meta charset="utf-8">

<body>
<script src="http://d3js.org/d3.v2.min.js?2.10.1"></script>
<script src="https://raw.github.com/d3/d3-plugins/master/hexbin/hexbin.js"></script>
<script src="https://raw.github.com/d3/d3-plugins/master/interpolate-zoom/interpolate-zoom.js"></script>


<script src="https://d3js.org/d3.v2.min.js?2.10.1"></script>
<script type="text/javascript">

var width = 960,
    height = 500,
    radius = 10;

var p0 = [250, 200, 60],
    p1 = [560, 300, 120];

var svg = d3.select("body").append("svg").attr("width", width).attr("height", height).append("g").call(transition, p0, p1);

svg.append("path").attr("class", "mesh").attr("d", d3.hexbin.mesh(width, height, radius));

svg.selectAll("circle").data([p0, p1]).enter().append("circle").attr("class", function(d, i) {
    return i ? "end" : "start";
}).attr("cx", function(d) {
    return d[0];
}).attr("cy", function(d) {
    return d[1];
}).attr("r", function(d) {
    return d[2] / 2 - .5;
});

function transition(svg, start, end) {
    var center = [width / 2, height / 2],
        i = d3.interpolateZoom(start, end);

    svg.attr("transform", transform(start)).transition().delay(250).duration(i.duration * 2).attrTween("transform", function() {
        return function(t) {
            return transform(i(t));
        };
    }).each("end", function() {
        d3.select(this).call(transition, end, start);
    });

    function transform(p) {
        var k = height / p[2];
        return "translate(" + (center[0] - p[0] * k) + "," + (center[1] - p[1] * k) + ")scale(" + k + ")";
    }
}

  </script></body></html>
