title: 3dwardsharp
description: a personal blog. notes, experiments, and things worth keeping.
lang: en
url: "https://edwardsharp.org"
baseurl: ""
timezone: America/New_York

collections_dir: content
collections:
  pages:
    output: true
    permalink: /:path/

layouts_dir: src/_layouts
includes_dir: src/_includes
sass:
  sass_dir: src/_sass
  style: compressed
  sourcemap: never

permalink: /post/:title/
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post

markdown: kramdown
kramdown:
  input: GFM
strict_front_matter: true
liquid:
  error_mode: strict

plugins:
  - jekyll-redirect-from

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - run-dev.sh
  - node_modules
  - src/tsconfig.json
  - src/prettier.config.mjs
  - src/tests
  - src/assets/feed.ts
  - src/assets/feed-filters.ts
  - src/assets/honeycomb.ts
  - src/assets/archive.ts
  - src/assets/search.ts
  - vendor
  - .bundle
  - .github
